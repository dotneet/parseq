[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "strhub"
version = "1.3.0"
description = "Scene Text Recognition Model Hub: A collection of deep learning models for Scene Text Recognition"
authors = [
  {name = "Darwin Bautista", email = "baudm@users.noreply.github.com"},
]
readme = "README.md"
license = "Apache-2.0"
license-files = ["NOTICE", "LICENSE", "strhub/models/*/LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "torch>=2.14",
  "torchvision>=0.29",
  "timm>=1.0.30",
  "lightning>=2.6",  # TODO: refactor code to separate model from training code.
  "nltk>=3.9",  # TODO: refactor/reorganize code. This is a train/test dependency.
  "PyYAML>=6.0",  # TODO: can we move this to train/test?
  "huggingface-hub>=0.30",
]

[project.optional-dependencies]
train = [
  "lmdb",
  "Pillow",
  "hydra-core>=1.3",
  "tensorboard",
  "fire",  # tools/create_lmdb_dataset.py
]
test = [
  "lmdb",
  "Pillow",
  "tqdm",
]
bench = [
  "hydra-core>=1.3",
  "fvcore",
]
tune = [
  "lmdb",
  "Pillow",
  "hydra-core>=1.3",
  "ray[tune]>=2.40",
  "ax-platform<1",  # ray.tune.search.ax.AxSearch is not compatible with Ax 1.x
]
webui = [
  "gradio>=5",
]
onnx = [  # tools/export_onnx.py
  "onnx",
  "onnxscript",  # required by the dynamo-based torch.onnx exporter
  "onnxruntime",
  "Pillow",
]

[dependency-groups]
dev = [
  "pre-commit",
]

[project.urls]
Homepage = "https://github.com/baudm/parseq"

[tool.setuptools]
packages = { find = { include = ["strhub*"] } }

[tool.uv]
default-groups = ["dev"]
# Supply-chain cooldown: ignore releases published in the last 7 days.
# Use `exclude-newer-package` to opt out a package (e.g. for an urgent security fix).
exclude-newer = "7 days"

[tool.pyink]
line-length = 120
pyink-use-majority-quotes = true

[tool.isort]
py_version = "auto"
profile = "django"
line_length = 120
ignore_comments = true  # To clear unused fmt: skip comments
known_torch = ["torch", "torchvision"]
known_torchlibs = ["timm", "lightning"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "TORCH", "TORCHLIBS", "FIRSTPARTY", "LOCALFOLDER"]

[tool.ruff]
fix = true
show-fixes = true
line-length = 120
output-format = "grouped"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
